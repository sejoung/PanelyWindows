# tools\verify.ps1을 그대로 실행한다(로컬 verify.cmd와 같은 기준).
# release.yml이 workflow_call로 재사용한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify.ps1

      - name: Upload verify logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-logs
          path: |
            artifacts/verify/*.log
            artifacts/verify/test-results/**/*.trx
          if-no-files-found: ignore
